<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Console Analytics - Datos Exactos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0f1e 0%, #1a1f35 50%, #2a2f45 100%);
      color: #f8fafc;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container { max-width: 1800px; margin: 0 auto; }
    .header {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 1.5rem;
    }
    .btn {
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.4);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
    }
    .btn-success {
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
    }
    .btn-warning {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
    }
    input, select {
      width: 100%;
      padding: 0.875rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 1rem;
    }
    input:focus, select:focus {
      border-color: #06b6d4;
      background: rgba(255, 255, 255, 0.08);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .stat-card.blue {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    .stat-card.purple {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .stat-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .stat-value { font-size: 1.8rem; font-weight: 700; }
    .hidden { display: none; }
    .loading { text-align: center; padding: 3rem; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      padding: 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      margin-top: 1rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.875rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    th {
      font-weight: 600;
      color: #cbd5e1;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .table-container {
      overflow-x: auto;
      max-height: 600px;
      overflow-y: auto;
      margin-top: 1rem;
    }
    .debug {
      padding: 1rem;
      background: rgba(6, 182, 212, 0.05);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #67e8f9;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Search Console Analytics - Datos Exactos</h1>
      <p style="color: #94a3b8; font-size: 0.95rem;">Los números coinciden 100% con Search Console oficial</p>
    </div>

    <!-- Setup -->
    <div id="setup" class="card">
      <h2 style="margin-bottom: 1.5rem;">🔐 Conectar</h2>
      <input type="text" id="clientId" placeholder="Client ID">
      <input type="password" id="clientSecret" placeholder="Client Secret">
      <button class="btn" onclick="connect()">Conectar con Google</button>
      <div id="setupMessage"></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="card">
        <button class="btn btn-secondary" onclick="disconnect()" style="float: right;">Desconectar</button>
        <h2 style="margin-bottom: 1.5rem;">⚙️ Configuración</h2>
        
        <div class="controls">
          <div>
            <label style="display: block; margin-bottom: 0.5rem; color: #cbd5e1;">Sitio</label>
            <select id="siteSelect"></select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 0.5rem; color: #cbd5e1;">Período</label>
            <select id="dateRange">
              <option value="7">Últimos 7 días</option>
              <option value="30" selected>Últimos 30 días</option>
              <option value="90">Últimos 90 días</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 0.5rem; color: #cbd5e1;">País</label>
            <select id="countryFilter">
              <option value="">Todos los países</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 0.5rem; color: #cbd5e1;">Dispositivo</label>
            <select id="deviceFilter">
              <option value="">Todos</option>
              <option value="MOBILE">Móvil</option>
              <option value="DESKTOP">Desktop</option>
              <option value="TABLET">Tablet</option>
            </select>
          </div>
        </div>

        <button class="btn" onclick="loadData()">🔄 Actualizar Datos</button>

        <div id="debugInfo" class="debug hidden"></div>

        <div style="margin-top: 1rem;">
          <button class="btn btn-success" onclick="exportExcel()">📊 Exportar Excel</button>
          <button class="btn btn-warning" onclick="generatePDF()" style="margin-left: 0.5rem;">📄 PDF</button>
        </div>
      </div>

      <div id="loading" class="hidden">
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando datos exactos...</p>
        </div>
      </div>

      <div id="stats" class="hidden">
        <div class="stats-grid">
          <div class="stat-card blue">
            <div class="stat-label">Total Clics</div>
            <div class="stat-value" style="color: #06b6d4;" id="totalClicks">0</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-label">Total Impresiones</div>
            <div class="stat-value" style="color: #a855f7;" id="totalImpressions">0</div>
          </div>
        </div>

        <div class="card">
          <h2>🔍 Keywords</h2>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Keyword</th>
                  <th>Clics</th>
                  <th>Impresiones</th>
                  <th>CTR</th>
                  <th>Posición</th>
                </tr>
              </thead>
              <tbody id="keywordsTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="message"></div>
    </div>
  </div>

  <script>
    let token = null;
    let config = {};
    let allData = null;

    window.onload = function() {
      const saved = localStorage.getItem('gsc_config');
      if (saved) {
        config = JSON.parse(saved);
        document.getElementById('clientId').value = config.clientId;
        document.getElementById('clientSecret').value = config.clientSecret;
      }

      const hash = window.location.hash;
      if (hash.includes('access_token')) {
        const params = new URLSearchParams(hash.substring(1));
        token = params.get('access_token');
        window.history.replaceState(null, '', window.location.pathname);
        
        if (token) {
          document.getElementById('setup').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          loadSites();
        }
      }
    };

    function connect() {
      const clientId = document.getElementById('clientId').value.trim();
      const clientSecret = document.getElementById('clientSecret').value.trim();

      if (!clientId || !clientSecret) {
        showMessage('setupMessage', 'Ingresa Client ID y Secret', 'error');
        return;
      }

      config = { clientId, clientSecret };
      localStorage.setItem('gsc_config', JSON.stringify(config));

      const redirectUri = window.location.origin + window.location.pathname;
      const scope = 'https://www.googleapis.com/auth/webmasters.readonly';
      const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
        `client_id=${encodeURIComponent(clientId)}&` +
        `redirect_uri=${encodeURIComponent(redirectUri)}&` +
        `response_type=token&` +
        `scope=${encodeURIComponent(scope)}`;

      window.location.href = authUrl;
    }

    function disconnect() {
      token = null;
      allData = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('setup').classList.remove('hidden');
    }

    async function loadSites() {
      try {
        showLoading(true);
        const response = await fetch('https://www.googleapis.com/webmasters/v3/sites', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const select = document.getElementById('siteSelect');
        select.innerHTML = '';

        if (data.siteEntry && data.siteEntry.length > 0) {
          data.siteEntry.forEach(site => {
            const option = document.createElement('option');
            option.value = site.siteUrl;
            option.textContent = site.siteUrl;
            select.appendChild(option);
          });
          // Auto-load first site
          loadData();
        }
      } catch (error) {
        showMessage('message', 'Error: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    async function loadData() {
      const site = document.getElementById('siteSelect').value;
      const days = parseInt(document.getElementById('dateRange').value);
      const country = document.getElementById('countryFilter').value;
      const device = document.getElementById('deviceFilter').value;

      if (!site) return;

      try {
        showLoading(true);
        document.getElementById('message').innerHTML = '';

        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - days);

        // Build filters
        const filters = [];
        if (country) {
          filters.push({ dimension: 'country', operator: 'equals', expression: country });
        }
        if (device) {
          filters.push({ dimension: 'device', operator: 'equals', expression: device });
        }

        // Get data - ONLY query dimension (like Search Console)
        const data = await fetchData(site, startDate, endDate, ['query'], filters);
        allData = data;

        // Load countries for dropdown
        await loadCountries(site, startDate, endDate, device);

        // Display
        displayData(data);

        // Debug info
        const debugInfo = document.getElementById('debugInfo');
        debugInfo.classList.remove('hidden');
        debugInfo.innerHTML = `
          <strong>📅 Período:</strong> ${formatDate(startDate)} → ${formatDate(endDate)}<br>
          <strong>📊 Keywords:</strong> ${data.rows ? data.rows.length.toLocaleString() : 0}<br>
          <strong>🎯 Filtros:</strong> ${filters.map(f => `${f.dimension}=${f.expression}`).join(', ') || 'Ninguno'}<br>
          <strong>✅ Agregación:</strong> Solo por query (igual que Search Console)
        `;
      } catch (error) {
        showMessage('message', 'Error: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    async function fetchData(site, startDate, endDate, dimensions, filters) {
      const body = {
        startDate: formatDate(startDate),
        endDate: formatDate(endDate),
        dimensions: dimensions,
        rowLimit: 25000
      };

      if (filters.length > 0) {
        body.dimensionFilterGroups = [{ filters: filters }];
      }

      const response = await fetch(
        `https://www.googleapis.com/webmasters/v3/sites/${encodeURIComponent(site)}/searchAnalytics/query`,
        {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        }
      );

      if (!response.ok) throw new Error('Error al cargar datos');
      return await response.json();
    }

    async function loadCountries(site, startDate, endDate, deviceFilter) {
      try {
        const filters = deviceFilter ? [{ dimension: 'device', operator: 'equals', expression: deviceFilter }] : [];
        const data = await fetchData(site, startDate, endDate, ['country'], filters);
        
        const select = document.getElementById('countryFilter');
        const currentValue = select.value;
        
        select.innerHTML = '<option value="">Todos los países</option>';
        
        if (data.rows) {
          data.rows.sort((a, b) => b.clicks - a.clicks);
          
          data.rows.forEach(row => {
            const option = document.createElement('option');
            option.value = row.keys[0];
            option.textContent = `${row.keys[0]} (${row.clicks.toLocaleString()} clics)`;
            select.appendChild(option);
          });
        }
        
        select.value = currentValue;
      } catch (error) {
        console.error('Error loading countries:', error);
      }
    }

    function displayData(data) {
      if (!data || !data.rows) {
        showMessage('message', 'No hay datos', 'error');
        return;
      }

      // Calculate totals (data already aggregated by API)
      let totalClicks = 0;
      let totalImpressions = 0;

      data.rows.forEach(row => {
        totalClicks += row.clicks;
        totalImpressions += row.impressions;
      });

      document.getElementById('totalClicks').textContent = totalClicks.toLocaleString();
      document.getElementById('totalImpressions').textContent = totalImpressions.toLocaleString();

      // Keywords table
      const tbody = document.getElementById('keywordsTable');
      tbody.innerHTML = '';

      data.rows.slice(0, 100).forEach(row => {
        const tr = tbody.insertRow();
        tr.innerHTML = `
          <td>${row.keys[0]}</td>
          <td style="font-weight: 600; color: #06b6d4;">${row.clicks.toLocaleString()}</td>
          <td>${row.impressions.toLocaleString()}</td>
          <td>${(row.ctr * 100).toFixed(2)}%</td>
          <td>${row.position.toFixed(1)}</td>
        `;
      });

      document.getElementById('stats').classList.remove('hidden');
    }

    function exportExcel() {
      if (!allData || !allData.rows) {
        alert('No hay datos para exportar');
        return;
      }

      const wb = XLSX.utils.book_new();
      
      const data = allData.rows.map(row => ({
        'Query': row.keys[0],
        'Clics': row.clicks,
        'Impresiones': row.impressions,
        'CTR': (row.ctr * 100).toFixed(2) + '%',
        'Posición': row.position.toFixed(2)
      }));
      
      const ws = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, 'Keywords');

      const site = document.getElementById('siteSelect').value.replace('sc-domain:', '').replace('https://', '');
      XLSX.writeFile(wb, `search-console-${site}-${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    function generatePDF() {
      if (!allData || !allData.rows) {
        alert('No hay datos para PDF');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(20);
      doc.setTextColor(6, 182, 212);
      doc.text('Search Console Analytics', 14, 20);
      
      const site = document.getElementById('siteSelect').value;
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Sitio: ${site}`, 14, 28);
      doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 14, 34);

      const data = allData.rows.slice(0, 50).map(row => [
        row.keys[0].substring(0, 40),
        row.clicks.toLocaleString(),
        row.impressions.toLocaleString(),
        (row.ctr * 100).toFixed(2) + '%',
        row.position.toFixed(1)
      ]);

      doc.autoTable({
        startY: 40,
        head: [['Keyword', 'Clics', 'Impresiones', 'CTR', 'Posición']],
        body: data,
        theme: 'striped',
        headStyles: { fillColor: [6, 182, 212] },
        styles: { fontSize: 8 }
      });

      const siteName = site.replace('sc-domain:', '').replace('https://', '');
      doc.save(`search-console-${siteName}-${new Date().toISOString().split('T')[0]}.pdf`);
    }

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    function showMessage(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.innerHTML = `<div class="${type}" style="margin-top: 1rem;">${message}</div>`;
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('hidden', !show);
    }
  </script>
</body>
</html>
